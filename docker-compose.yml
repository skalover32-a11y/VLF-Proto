services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: vlf-gateway
    depends_on:
      - tcp-echo
      - udp-echo
    ports:
      - "8080:8080"
      - "443:443/udp"
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./certs:/app/certs:rw
    restart: unless-stopped

  tcp-echo:
    build:
      context: .
      dockerfile: Dockerfile
      target: tcp-echo
    container_name: vlf-tcp-echo
    restart: unless-stopped

  udp-echo:
    build:
      context: .
      dockerfile: Dockerfile
      target: udp-echo
    container_name: vlf-udp-echo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vlf-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway
    profiles:
      - observability
