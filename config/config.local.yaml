listen_http: ":18080"
listen_quic: ":8443"
listen_tcp: ":8443"
allow_insecure_http: true
protocol_id: "vlf-runtime/0.1"
log_level: "info"
max_dgram_payload: 1200

tls:
  cert_path: "certs/dev-local.crt"
  key_path: "certs/dev-local.key"
  auto_generate: true

client_secrets:
  smoke-client: "smoke-secret"

auth:
  clock_skew: "60s"
  replay_ttl: "60s"

limits:
  max_conns_per_client: 64
  max_total_conns: 2048
  max_bytes_per_minute_per_client: 33554432
  max_recv_window_bytes: 65536
  relay_send_window_bytes: 65536
  max_flows_per_session: 128
  max_udp_pps: 2000
  max_bytes_per_minute_per_session: 67108864
  session_up_kbps: 20000
  session_down_kbps: 20000

timeouts:
  relay_idle: "20s"
  session_idle: "60s"
  dial_timeout: "10s"
